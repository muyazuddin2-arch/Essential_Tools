si:"මුදල, වාර්ෂික පොලී අනුපාතය සහ කාලය ඇතුළත් කරන්න. ප්‍රතිඵල වහාම යාවත්කාලීන වේ.|මෙහි සාමාන්‍ය|අර්ධ වාර්ෂික සංයුක්ත පොලිය",
sw:"Weka kiasi, riba ya mwaka na muda. Matokeo husasishwa mara moja.|Kawaida hapa|Riba mseto ya nusu mwaka",
he:"הזינו סכום, ריבית שנתית ותקופה. התוצאה מתעדכנת מיד.|נפוץ כאן|ריבית דריבית חצי-שנתית",
el:"Εισάγετε ποσό, ετήσιο επιτόκιο και διάρκεια. Το αποτέλεσμα ενημερώνεται άμεσα.|Συνηθισμένο εδώ|Εξαμηνιαίος ανατοκισμός",
sv:"Ange belopp, årsränta och löptid. Resultatet uppdateras direkt.|Vanligt här|Halvårsvis ränteberäkning"};

/* common methods by country: c = common methods, s = semi-annual compounding. Countries not listed use the standard reducing-balance formula. */
const R={BD:{c:["r","f"]},IN:{c:["r","f"]},US:{c:["r"]},GB:{c:["r"]},CA:{c:["r"],s:1},AU:{c:["r"]},DE:{c:["r"]},JP:{c:["r","e"]},CN:{c:["r","e"]},RU:{c:["r","e"]},SA:{c:["f","r"]},MY:{c:["f","r"]}};
const $=id=>document.getElementById(id),T=k=>ET.t(k),T2=k=>ET.t2(k),L=()=>document.documentElement.lang;
const unitName=u=>{try{return new Intl.NumberFormat(L(),{style:"unit",unit:u,unitDisplay:"long"}).formatToParts(2).find(p=>p.type==="unit").value}catch(e){return u==="year"?"years":"months"}};
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("l0").textContent=T(1);$("l1").textContent=T(2);$("l2").textContent=T(3);$("l4").textContent=T(5);
$("r0").textContent=T(9);$("r1").textContent=T(10);$("r2").textContent=T(11);
const uv=$("unit").value||"year";$("unit").innerHTML='<option value="year">'+unitName("year")+'</option><option value="month">'+unitName("month")+'</option>';$("unit").value=uv;
const mv=$("mth").value||"r";$("mth").innerHTML='<option value="r">'+T(6)+'</option><option value="e">'+T(7)+'</option><option value="f">'+T(8)+'</option>';$("mth").value=mv;
const r=R[ET.state.country];
$("note").textContent=r?T2(1)+": "+r.c.map(k=>T({r:6,e:7,f:8}[k])).join(", ")+(r.s?" · "+T2(2):""):"";
update()}
function update(){
const money=ET.money,m=$("mth").value,semi=(R[ET.state.country]||{}).s;
const P=parseFloat($("amt").value),r=parseFloat($("rate").value),tv=parseFloat($("term").value);
const n=Math.round($("unit").value==="year"?tv*12:tv);
const bar=$("bar").children;
if(!(P>0)||!(r>=0)||!(n>0)||n>1200){$("emi").textContent="—";$("ti").textContent="—";$("tp").textContent="—";bar[0].style.width="0";bar[1].style.width="0";return}
const i=semi?Math.pow(1+r/200,1/6)-1:r/1200;
let first,last,ti;
if(m==="r"){first=last=i===0?P/n:P*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1);ti=first*n-P}
else if(m==="e"){first=P/n+P*i;last=P/n+(P/n)*i;ti=i*P*(n+1)/2}
else{ti=P*r/100*(n/12);first=last=(P+ti)/n}
const tp=P+ti;
const e=Math.abs(first-last)<0.005?money(first):money(first)+" – "+money(last);
$("emi").textContent=e;$("ti").textContent=money(ti);$("tp").textContent=money(tp);
bar[0].style.width=(P/tp*100)+"%";bar[1].style.width=(ti/tp*100)+"%";
ET.log(money(P)+" · "+r+"% · "+tv+" "+$("unit").selectedOptions[0].text+" → "+e)}
["amt","rate","term","unit","mth"].forEach(id=>$(id).addEventListener("input",update));
ET.start({id:"emi",file:"emi.html",S,S2,labels,ctry:()=>T(4),warn:()=>T(12),guide:()=>T2(0)});
</script>
