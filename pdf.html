const $=id=>document.getElementById(id),T=k=>ET.t(k);
let mode="m",items=[],res=[];
const sizeTxt=b=>{const m=b>=1048576,v=m?b/1048576:b/1024;try{return new Intl.NumberFormat(ET.state.lang,{style:"unit",unit:m?"megabyte":"kilobyte",maximumFractionDigits:1}).format(v)}catch(e){return v.toFixed(1)+(m?" MB":" KB")}};
const numTxt=n=>{try{return new Intl.NumberFormat(ET.state.lang).format(n)}catch(e){return String(n)}};
/*CORE*/
function parseRanges(s,n,lang){
s=s.replace(/\p{Nd}/gu,c=>{const cp=c.codePointAt(0);let k=0;while(/\p{Nd}/u.test(String.fromCodePoint(cp-k-1)))k++;return String(k%10)}).replace(/[–—−‒－]/g,"-").replace(/[،;、，；]/g,",");
const out=[];
for(const part of s.split(",")){const t=part.trim();if(!t)continue;
const m=t.match(/^(\d+)\s*(?:-\s*(\d+))?$/);if(!m)return null;
const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b<a||b>n)return null;out.push([a,b])}
return out.length?out:null}
async function mergeBufs(PL,bufs){const o=await PL.PDFDocument.create();
for(const b of bufs){const s=await PL.PDFDocument.load(b);(await o.copyPages(s,s.getPageIndices())).forEach(p=>o.addPage(p))}
return o.save()}
async function splitBuf(PL,buf,ranges){const s=await PL.PDFDocument.load(buf),r=[];
for(const [a,b] of ranges){const o=await PL.PDFDocument.create(),idx=[];for(let i=a-1;i<b;i++)idx.push(i);
(await o.copyPages(s,idx)).forEach(p=>o.addPage(p));r.push(await o.save())}
return r}
/*ENDCORE*/
const base=n=>n.replace(/\.[^.]+$/,"");
function clearRes(){res.forEach(r=>URL.revokeObjectURL(r.url));res=[];renderRes()}
async function addFiles(list){
$("err").textContent="";clearRes();
let L=[...list];if(mode==="s"){L=L.slice(0,1);items=[]}
for(const f of L){
try{if(!/pdf/i.test(f.type)&&!/\.pdf$/i.test(f.name))throw 0;
const d=await PDFLib.PDFDocument.load(await f.arrayBuffer());items.push({f,pages:d.getPageCount()})}
catch(e){$("err").textContent=f.name+": "+T(9)}}
renderItems()}
function renderItems(){
const L=$("list");L.replaceChildren();
items.forEach((it,i)=>{const d=document.createElement("div");d.className="item";
const t=document.createElement("div");t.className="nm";t.textContent=it.f.name+" · "+T(7)+": "+numTxt(it.pages)+" · "+sizeTxt(it.f.size);d.appendChild(t);
const mk=(s,fn,dis)=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.disabled=!!dis;b.onclick=fn;d.appendChild(b)};
if(mode==="m"){mk("↑",()=>{[items[i-1],items[i]]=[items[i],items[i-1]];renderItems()},i===0);mk("↓",()=>{[items[i+1],items[i]]=[items[i],items[i+1]];renderItems()},i===items.length-1)}
mk("✕",()=>{items.splice(i,1);clearRes();renderItems()});
L.appendChild(d)});
$("sp").hidden=mode!=="s";$("one").hidden=mode!=="s";
$("go").hidden=false;$("go").textContent=mode==="m"?T(1):T(2);
$("go").disabled=mode==="m"?items.length<2:items.length<1;$("one").disabled=items.length<1;
$("m1").setAttribute("aria-pressed",String(mode==="m"));$("m2").setAttribute("aria-pressed",String(mode==="s"));
$("f").multiple=mode==="m"}
function renderRes(){
const L=$("res");L.replaceChildren();
res.forEach(r=>{const d=document.createElement("div");d.className="item";
const t=document.createElement("div");t.className="nm";t.textContent=r.name+" · "+T(7)+": "+numTxt(r.pages)+" · "+sizeTxt(r.size);
const a=document.createElement("a");a.className="btn";a.href=r.url;a.download=r.name;a.textContent=T(6);
d.appendChild(t);d.appendChild(a);L.appendChild(d)})}
function addRes(name,bytes,pages){res.push({name,size:bytes.length,pages,url:URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}))})}
async function run(kind){
$("err").textContent="";clearRes();$("busy").textContent="…";
try{
if(mode==="m"){
const bytes=await mergeBufs(PDFLib,await Promise.all(items.map(i=>i.f.arrayBuffer())));
const tot=items.reduce((s,i)=>s+i.pages,0);addRes("merged.pdf",bytes,tot);
ET.logNow(T(1)+": "+items.map(i=>i.f.name).join(", ")+" → "+numTxt(tot)+" "+T(7))}
else{
const it=items[0];let rg;
if(kind==="one")rg=Array.from({length:it.pages},(_,i)=>[i+1,i+1]);
else{rg=parseRanges($("rg").value,it.pages,ET.state.lang);if(!rg){$("err").textContent=T(8);$("busy").textContent="";return}}
const outs=await splitBuf(PDFLib,await it.f.arrayBuffer(),rg);
outs.forEach((b,i)=>{const a=rg[i][0],z=rg[i][1];addRes(base(it.f.name)+"-"+(a===z?a:a+"-"+z)+".pdf",b,z-a+1)});
ET.logNow(T(2)+": "+it.f.name+" → "+outs.length+" × PDF")}
}catch(e){$("err").textContent=T(9)}
$("busy").textContent="";renderRes()}
function setMode(m){mode=m;if(m==="s"&&items.length>1)items=items.slice(0,1);clearRes();$("err").textContent="";renderItems()}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("m1").textContent=T(1);$("m2").textContent=T(2);$("pick").textContent=T(3);$("lr").textContent=T(4);$("one").textContent=T(5);
renderItems();renderRes()}
$("m1").onclick=()=>setMode("m");$("m2").onclick=()=>setMode("s");
$("pick").onclick=()=>$("f").click();
$("f").addEventListener("change",e=>{addFiles(e.target.files);e.target.value=""});
const dz=$("drop");
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("on")});
dz.addEventListener("dragleave",()=>dz.classList.remove("on"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("on");addFiles(e.dataTransfer.files)});
$("go").onclick=()=>run("go");$("one").onclick=()=>run("one");
ET.start({id:"pdf",file:"pdf.html",S,S2,labels,guide:()=>ET.t2(0),warn:()=>T(10),currency:false});
</script>
