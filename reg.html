sv:"Kostnad för lagfart av mark|Markvärde|Taxeringsvärde (det högre gäller)|Skatt eller avgift|Total kostnad|Lägg till rad|Satser ändras ofta och varierar mellan regioner. Ange aktuella satser från myndigheten; resultaten är uppskattningar.|Ange markvärdet, sedan varje skatt eller avgift med sats (%). Summan räknas ut automatiskt."};
const $=id=>document.getElementById(id),T=k=>ET.t(k);
/* Typical tax/fee names per country (local terms, shown as written locally). Rates are NOT preset: they change often and differ by area, so the user enters current ones from the registry office. */
const C={BD:["স্ট্যাম্প শুল্ক","রেজিস্ট্রেশন ফি","স্থানীয় সরকার কর","গেইন ট্যাক্স","VAT"],IN:["Stamp duty","Registration fee","Cess / surcharge"],PK:["Stamp duty","Registration fee","Withholding tax"],NP:["रजिस्ट्रेसन दस्तुर","पुँजीगत लाभ कर"],LK:["Stamp duty","Registration fee"],US:["Transfer tax","Recording fee"],CA:["Land transfer tax","Registration fee"],GB:["Stamp Duty Land Tax","Land Registry fee"],IE:["Stamp duty","Land Registry fee"],AU:["Transfer duty","Registration fee"],DE:["Grunderwerbsteuer","Notar","Grundbuch"],AT:["Grunderwerbsteuer","Eintragungsgebühr"],CH:["Handänderungssteuer","Notar / Grundbuch"],FR:["Droits de mutation","Émoluments du notaire"],ES:["ITP / IVA","AJD","Notaría / Registro"],IT:["Imposta di registro","Imposte ipotecaria e catastale","Notaio"],NL:["Overdrachtsbelasting","Notaris","Kadaster"],GR:["Φόρος μεταβίβασης","Συμβολαιογράφος"],PL:["PCC","Taksa notarialna","Opłata sądowa"],SE:["Lagfartsavgift"],RU:["Госпошлина"],TR:["Tapu harcı","Döner sermaye"],CN:["契税","印花税","登记费"],JP:["登録免許税","不動産取得税"],KR:["취득세","등록면허세"],ZA:["Transfer duty","Conveyancing"]};
const O={BD:"সাব-রেজিস্ট্রি অফিস",IN:"Sub-Registrar Office",PK:"Sub-Registrar",NP:"मालपोत कार्यालय",LK:"Land Registry",US:"County recorder",CA:"Land Titles Office",GB:"HM Land Registry",IE:"Land Registry",AU:"Land titles office",DE:"Grundbuchamt",AT:"Grundbuch",CH:"Grundbuchamt",FR:"Notaire / Service de la publicité foncière",ES:"Registro de la Propiedad",IT:"Agenzia delle Entrate",NL:"Kadaster",GR:"Κτηματολόγιο",PL:"Księga wieczysta",SE:"Lantmäteriet",RU:"Росреестр",TR:"Tapu Müdürlüğü",CN:"不动产登记中心",JP:"法務局",KR:"등기소",ZA:"Deeds Office"};
/* countries where the registry charges on the higher of deal value and government-assessed value */
const HV=["BD","IN","PK","NP"];
let D={v:"",h:"",rows:[],ov:0};
function num(v){let s=String(v||"").trim().replace(/\s/g,"");
s=s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x6F0).replace(/[\u0966-\u096F]/g,c=>c.charCodeAt(0)-0x966).replace(/[\u09E6-\u09EF]/g,c=>c.charCodeAt(0)-0x9E6);
if(s.includes(",")&&s.includes("."))s=s.replace(/,/g,"");else s=s.replace(",",".");
const n=parseFloat(s);return isFinite(n)&&n>=0?n:0}
const nf=x=>{try{return new Intl.NumberFormat(ET.state.lang,{maximumFractionDigits:2}).format(x)}catch(e){return String(x)}};
const hv=()=>HV.includes(ET.state.country);
function draw(){
const out=$("out");out.replaceChildren();
const base=Math.max(num(D.v),hv()?num(D.h):0);
if(!base)return;
let tot=0;const log=[];
const li=(a,b,c)=>{const e=document.createElement("li");if(c)e.className=c;const x=document.createElement("span"),y=document.createElement("span");x.textContent=a;x.setAttribute("dir","auto");y.textContent=b;e.append(x,y);out.appendChild(e)};
D.rows.forEach(r=>{const p=num(r.r);if(!p)return;const a=base*p/100;tot+=a;li((r.n||T(3))+" ("+nf(p)+"%)",ET.money(a))});
if(!tot)return;
li(T(4)+" ("+nf(tot/base*100)+"%)",ET.money(tot),"tt");
ET.log(ET.money(base)+" → "+ET.money(tot))}
function rowsUI(){
const box=$("rows");box.replaceChildren();
D.rows.forEach((r,i)=>{const d=document.createElement("div");d.className="rw";
const n=document.createElement("input"),p=document.createElement("input"),x=document.createElement("button");
n.className="nm";n.value=r.n;n.placeholder=T(3);n.setAttribute("aria-label",T(3));n.setAttribute("dir","auto");
p.className="rt";p.value=r.r;p.placeholder="%";p.setAttribute("inputmode","decimal");p.setAttribute("aria-label","%");
x.type="button";x.textContent="✕";x.setAttribute("aria-label","✕");
n.oninput=()=>{r.n=n.value;D.ov=1;draw()};p.oninput=()=>{r.r=p.value;D.ov=1;draw()};
x.onclick=()=>{D.rows.splice(i,1);D.ov=1;rowsUI();draw()};
d.append(n,p,x);box.appendChild(d)})}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("l_v").textContent=T(1);$("l_h").textContent=T(2);$("h_r").textContent=T(3);$("ad").textContent="+ "+T(5);
$("hv").hidden=!hv();
if(!D.ov)D.rows=(C[ET.state.country]||[""]).map(n=>({n,r:""}));
$("of").textContent=O[ET.state.country]?"🏛 "+O[ET.state.country]:"";
rowsUI();draw()}
$("v").oninput=e=>{D.v=e.target.value;draw()};
$("h").oninput=e=>{D.h=e.target.value;draw()};
$("ad").onclick=()=>{D.rows.push({n:"",r:""});D.ov=1;rowsUI()};
ET.start({id:"reg",file:"reg.html",S,labels,guide:()=>T(7),warn:()=>T(6)});
</script>
</body>
