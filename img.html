const $=id=>document.getElementById(id),T=k=>ET.t(k);
let files=[],res=[],tok=0,tm=null;
const sizeTxt=b=>{const m=b>=1048576,v=m?b/1048576:b/1024;try{return new Intl.NumberFormat(ET.state.lang,{style:"unit",unit:m?"megabyte":"kilobyte",maximumFractionDigits:1}).format(v)}catch(e){return v.toFixed(1)+(m?" MB":" KB")}};
const pctTxt=p=>{try{return new Intl.NumberFormat(ET.state.lang,{style:"percent",maximumFractionDigits:0}).format(p)}catch(e){return Math.round(p*100)+"%"}};
/*FIT*/
async function fit(enc,w,h,lim){
let sc=1;
for(;;){const W=Math.max(1,Math.round(w*sc)),H=Math.max(1,Math.round(h*sc));
let best=await enc(W,H,.05);
if(best.size<=lim){let lo=.05,hi=.95;for(let i=0;i<6;i++){const m=(lo+hi)/2,b=await enc(W,H,m);if(b.size<=lim){best=b;lo=m}else hi=m}return{blob:best,W,H,ok:true}}
if(W<=64||H<=64)return{blob:best,W,H,ok:false};
sc*=.75}}
/*ENDFIT*/
async function load(f){try{return await createImageBitmap(f)}catch(e){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}}
async function compress(f,fmt,q,mw,tg){
const bm=await load(f);let w=bm.naturalWidth||bm.width,h=bm.naturalHeight||bm.height;
if(mw>0&&w>mw){h=Math.round(h*mw/w);w=mw}
const enc=(W,H,qq)=>{const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
if(fmt==="image/jpeg"){g.fillStyle="#fff";g.fillRect(0,0,W,H)}g.drawImage(bm,0,0,W,H);return new Promise(r=>c.toBlob(r,fmt,qq))};
let blob,ok=true;
if(tg>0){const r=await fit(enc,w,h,tg*1024);blob=r.blob;ok=r.ok}else blob=await enc(w,h,q/100);
if(bm.close)bm.close();
return{name:f.name,orig:f.size,size:blob.size,url:URL.createObjectURL(blob),out:f.name.replace(/\.[^.]+$/,"")+"-compressed."+(fmt==="image/webp"?"webp":"jpg"),ok}}
async function go(){
const my=++tok;res.forEach(r=>URL.revokeObjectURL(r.url));res=[];$("err").textContent="";
const fmt=$("fm").value,q=+$("q").value,mw=parseInt($("mw").value)||0,tg=parseFloat($("tg").value)||0;
$("q").disabled=tg>0;$("qv").textContent=pctTxt(q/100);
for(const f of files){
if(!f.type.startsWith("image/")){$("err").textContent=f.name+": "+T(8);continue}
try{const r=await compress(f,fmt,q,mw,tg);if(my!==tok){URL.revokeObjectURL(r.url);return}res.push(r)}catch(e){$("err").textContent=f.name+": "+T(8)}}
if(my!==tok)return;
renderList();res.forEach(r=>ET.logNow(r.name+": "+sizeTxt(r.orig)+" → "+sizeTxt(r.size)+" ("+pctTxt(1-r.size/r.orig)+")"))}
function renderList(){
const L=$("list");L.replaceChildren();
res.forEach(r=>{const d=document.createElement("div");d.className="item";
const im=document.createElement("img");im.src=r.url;im.alt="";d.appendChild(im);
const b=document.createElement("div"),n=document.createElement("strong"),s=document.createElement("div"),p=document.createElement("div"),a=document.createElement("a");
n.textContent=r.name;s.textContent=sizeTxt(r.orig)+" → "+sizeTxt(r.size);p.textContent=T(7)+": "+pctTxt(1-r.size/r.orig);
a.className="btn";a.href=r.url;a.download=r.out;a.textContent=T(6);
[n,s,p,a].forEach(e=>b.appendChild(e));d.appendChild(b);L.appendChild(d)});
$("msg").textContent=res.some(r=>!r.ok)?T(9):""}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("pick").textContent=T(1);$("l2").textContent=T(2);$("l3").textContent=T(3);$("l4").textContent=T(4);$("l5").textContent=T(5);
const v=$("fm").value||"image/jpeg";
let w="";try{if(document.createElement("canvas").toDataURL("image/webp").indexOf("data:image/webp")===0)w='<option value="image/webp">WebP</option>'}catch(e){}
$("fm").innerHTML='<option value="image/jpeg">JPEG</option>'+w;$("fm").value=v;
$("qv").textContent=pctTxt(+$("q").value/100);renderList()}
const later=()=>{clearTimeout(tm);tm=setTimeout(go,400)};
["q","fm","mw","tg"].forEach(id=>$(id).addEventListener("input",later));
$("pick").onclick=()=>$("f").click();
$("f").addEventListener("change",e=>{files=[...e.target.files];go()});
const dz=$("drop");
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("on")});
dz.addEventListener("dragleave",()=>dz.classList.remove("on"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("on");files=[...e.dataTransfer.files];go()});
ET.start({id:"img",file:"img.html",S,S2,labels,guide:()=>ET.t2(0),warn:()=>T(10),currency:false});
</script>
