/*QR*/
function qrEncode(bytes){
const ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
const raw=v=>{const a=v>1?Math.floor(v/7)+2:0;return(16*v+128)*v+64-(v>1?(25*a-10)*a-55:0)-(v>6?36:0)};
const dcw=v=>Math.floor(raw(v)/8)-ECC[v-1]*NB[v-1];
let ver=0;for(let v=1;v<=10;v++)if(4+(v<10?8:16)+8*bytes.length<=dcw(v)*8){ver=v;break}
if(!ver)return null;
const bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
const cap=dcw(ver)*8;put(0,Math.min(4,cap-bits.length));
while(bits.length%8)bits.push(0);
for(let p=0xEC;bits.length<cap;p^=0xFD)put(p,8);
const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const nb=NB[ver-1],el=ECC[ver-1],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb);
const div=Array(el).fill(0);div[el-1]=1;
for(let i=0,root=1;i<el;i++){for(let j=0;j<el;j++){div[j]=mul(div[j],root);if(j+1<el)div[j]^=div[j+1]}root=mul(root,2)}
const blocks=[];
for(let i=0,k=0;i<nb;i++){const len=sl-el+(i<ns?0:1),d=data.slice(k,k+len);k+=len;
const r=div.map(()=>0);d.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,x)=>r[x]^=mul(c,f))});
if(i<ns)d.push(0);blocks.push(d.concat(r))}
const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)all.push(b[i])});
const n=ver*4+17,M=[...Array(n)].map(()=>Array(n).fill(0)),F=[...Array(n)].map(()=>Array(n).fill(0));
const sf=(x,y,v)=>{if(x>=0&&x<n&&y>=0&&y<n){M[y][x]=v?1:0;F[y][x]=1}};
for(let i=0;i<n;i++){sf(6,i,i%2===0);sf(i,6,i%2===0)}
const fp=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));sf(x+dx,y+dy,d!==2&&d!==4)}};
fp(3,3);fp(n-4,3);fp(3,n-4);
if(ver>1){const na=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(na*2-2))*2,pos=[6];
for(let p=n-7;pos.length<na;p-=step)pos.splice(1,0,p);
pos.forEach((px,i)=>pos.forEach((py,j)=>{if(!((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(px+dx,py+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
const fmt=m=>{let r=m;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(m<<10|r)^0x5412,g=i=>((b>>>i)&1)===1;
for(let i=0;i<=5;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
for(let i=0;i<8;i++)sf(n-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,n-15+i,g(i));sf(8,n-8,true)};
fmt(0);
if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;
for(let i=0;i<18;i++){const c=((b>>>i)&1)===1,a=n-11+i%3,q=Math.floor(i/3);sf(a,q,c);sf(q,a,c)}}
let k=0;const tot=all.length*8;
for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<n;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-v:v;if(!F[y][x]&&k<tot){M[y][x]=(all[k>>>3]>>>(7-(k&7)))&1;k++}}}
const MK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
const pen=()=>{let p=0;for(let t=0;t<2;t++)for(let i=0;i<n;i++){let run=1;for(let j=1;j<n;j++){const a=t?M[j][i]:M[i][j],b=t?M[j-1][i]:M[i][j-1];if(a===b){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
let d=0;M.forEach(r=>r.forEach(v=>d+=v));return p+Math.floor(Math.abs(d*20-n*n*10)/(n*n))*10};
const base=M.map(r=>r.slice());let best=null,bp=1e9;
for(let m=0;m<8;m++){for(let y=0;y<n;y++)for(let x=0;x<n;x++)M[y][x]=base[y][x]^((!F[y][x]&&MK[m](x,y))?1:0);fmt(m);const p=pen();if(p<bp){bp=p;best=M.map(r=>r.slice())}}
return best}
/*END*/

/* phone country calling codes (the country chosen above sets the default code) */
const CC={BD:880,IN:91,PK:92,NP:977,LK:94,US:1,CA:1,GB:44,IE:353,AU:61,DE:49,AT:43,CH:41,FR:33,ES:34,IT:39,NL:31,GR:30,PL:48,UA:380,SE:46,RU:7,KZ:7,TR:90,IL:972,IR:98,SA:966,AE:971,EG:20,JP:81,KR:82,CN:86,TH:66,VN:84,MY:60,SG:65,ID:62,BR:55,MX:52,ZA:27,KE:254,NG:234};
const F={x:[["ta",2]],w:[["a",3],["b",4]],p:[["a",5]],a:[["a",5],["b",6]],e:[["a",7],["b",6]]};
const $=id=>document.getElementById(id),T=k=>ET.t(k),U={};
function phone(v){
let s=v.replace(/[\s\-().]/g,"");if(!s)return null;
if(s[0]==="+")s=s.slice(1);else if(s.slice(0,2)==="00")s=s.slice(2);
else{const c=CC[ET.state.country];s=s.replace(/\D/g,"");
if(c){const cr=ET.state.country;if(cr==="RU"||cr==="KZ")s=s.replace(/^8/,"");else if(cr!=="IT")s=s.replace(/^0/,"");s=c+s}}
s=s.replace(/\D/g,"");return s.length>=7&&s.length<=15?s:null}
const esc=s=>s.replace(/([\\;,:"])/g,"\\$1");
function payload(){
const ty=$("ty").value,a=$("a").value.trim(),b=$("b").value.trim(),x=$("ta").value;$("fin").textContent="";
if(ty==="x")return x.trim()?{d:x,h:T(2)+": "+x.trim().slice(0,50)}:null;
if(ty==="w")return a?{d:"WIFI:T:"+(b?"WPA":"nopass")+";S:"+esc(a)+";"+(b?"P:"+esc(b)+";":"")+";",h:"Wi-Fi: "+a}:null;
if(ty==="e")return /^\S+@\S+\.\S+$/.test(a)?{d:"mailto:"+a+(b?"?body="+encodeURIComponent(b):""),h:T(7)+": "+a}:null;
const n=phone(a);if(!n)return null;$("fin").textContent="+"+n;
return ty==="p"?{d:"tel:+"+n,h:T(5)+": +"+n}:{d:"https://wa.me/"+n+(b?"?text="+encodeURIComponent(b):""),h:"WhatsApp: +"+n}}
function draw(M){
const n=M.length,N=n+8;let d="";
for(let y=0;y<n;y++){let x=0;while(x<n){if(M[y][x]){let l=1;while(x+l<n&&M[y][x+l])l++;d+="M"+(x+4)+" "+(y+4)+"h"+l+"v1h-"+l+"z";x+=l}else x++}}
const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+N+" "+N+'" shape-rendering="crispEdges"><rect width="'+N+'" height="'+N+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
$("pv").innerHTML=svg;
if(U.s)URL.revokeObjectURL(U.s);U.s=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));$("ds").href=U.s;
const c=document.createElement("canvas"),s=12;c.width=c.height=N*s;const g=c.getContext("2d");
g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#000";
for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])g.fillRect((x+4)*s,(y+4)*s,s,s);
c.toBlob(b=>{if(U.p)URL.revokeObjectURL(U.p);U.p=URL.createObjectURL(b);$("dp").href=U.p},"image/png")}
function update(){
const ty=$("ty").value;
["ta","a","b"].forEach(id=>{$(id).hidden=true;$("l"+id).hidden=true});
F[ty].forEach(f=>{$(f[0]).hidden=false;$("l"+f[0]).hidden=false;$("l"+f[0]).textContent=T(f[1])});
$("a").placeholder=(ty==="p"||ty==="a")?"+"+(CC[ET.state.country]||"")+" …":"";$("err").textContent="";$("out").hidden=true;
const p=payload();if(!p)return;
const m=qrEncode([...new TextEncoder().encode(p.d)]);
if(!m){$("err").textContent=T(10);return}
draw(m);$("out").hidden=false;ET.log(p.h)}

$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";

$("ty").value=v;update()}
["ty","ta","a","b"].forEach(id=>$(id).addEventListener("input",update));
