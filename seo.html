ta:"புலங்களை நிரப்பி குறியீட்டை உங்கள் பக்கத்தின் head பகுதியில் ஒட்டவும். எல்லாம் உங்கள் உலாவியிலேயே நடக்கும், எதுவும் பதிவேற்றப்படாது. மாதிரி உரையை உங்கள் உரையால் மாற்றவும்.",
te:"ఫీల్డ్‌లు నింపి కోడ్‌ను మీ పేజీ head భాగంలో అతికించండి. అంతా మీ బ్రౌజర్‌లోనే జరుగుతుంది, ఏదీ అప్‌లోడ్ కాదు. నమూనా టెక్స్ట్‌ను మీ సొంత టెక్స్ట్‌తో మార్చండి.",
mr:"रकाने भरा आणि कोड तुमच्या पानाच्या head भागात चिकटवा. सर्व काही तुमच्या ब्राउझरमध्येच होते, काहीही अपलोड होत नाही. नमुना मजकूर तुमच्या मजकुराने बदला.",
ne:"खाली ठाउँ भरेर कोडलाई आफ्नो पृष्ठको head भागमा राख्नुहोस्। सबै कुरा तपाईंको ब्राउजरमै हुन्छ, केही अपलोड हुँदैन। नमुना पाठलाई आफ्नै पाठले बदल्नुहोस्।",
si:"ක්ෂේත්‍ර පුරවා කේතය ඔබේ පිටුවේ head කොටසට පිටපත් කරන්න. සියල්ල ඔබේ බ්‍රවුසරයේම සිදු වේ, කිසිවක් උඩුගත නොවේ. නියැදි පෙළ ඔබේම පෙළින් ප්‍රතිස්ථාපනය කරන්න.",
sw:"Jaza sehemu na unakili msimbo kwenye sehemu ya head ya ukurasa wako. Kila kitu hufanyika kwenye kivinjari chako, hakuna kinachopakiwa. Badilisha maandishi ya mfano na yako.",
he:"מלאו את השדות והעתיקו את הקוד לחלק head של העמוד. הכול מתבצע בדפדפן שלכם ושום דבר לא מועלה. החליפו את טקסט הדוגמה בטקסט שלכם.",
el:"Συμπληρώστε τα πεδία και αντιγράψτε τον κώδικα στην ενότητα head της σελίδας σας. Όλα γίνονται στον browser σας και τίποτα δεν ανεβαίνει. Αντικαταστήστε τα δείγματα κειμένου με δικά σας.",
sv:"Fyll i fälten och kopiera koden till head-delen på din sida. Allt sker i din webbläsare och inget laddas upp. Ersätt exempeltexterna med dina egna."};

const $=id=>document.getElementById(id),T=k=>ET.t(k),KEY="et_seo";
let D={ti:"",de:"",ur:"",sn:"",im:"",lc:"",idx:true,vg:"",vb:"",vy:"",vz:"",vn:"",ov:{}};
try{const s=JSON.parse(sessionStorage.getItem(KEY)||"null");if(s)D=Object.assign(D,s)}catch(e){}
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
/* search engines that matter in some countries (verification meta tags): y = Yandex, z = Baidu, n = Naver */
const LOCAL={RU:"vy",KZ:"vy",CN:"vz",KR:"vn"};
const VF={vg:["Google","google-site-verification"],vb:["Bing","msvalidate.01"],vy:["Yandex","yandex-verification"],vz:["Baidu","baidu-site-verification"],vn:["Naver","naver-site-verification"]};
const defLoc=()=>{const c=ET.state.country,l=ET.state.lang;return c==="INT"?(l==="en"?"en_US":l):l+"_"+c};
const numTxt=n=>{try{return new Intl.NumberFormat(ET.state.lang).format(n)}catch(e){return String(n)}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/*GEN*/
function gen(){
const L=[],a=s=>L.push(s),m=(k,v)=>a('<meta '+k+' content="'+esc(v)+'">');
a('<meta charset="utf-8">');a('<meta name="viewport" content="width=device-width, initial-scale=1">');
if(D.ti)a("<title>"+esc(D.ti)+"</title>");
if(D.de)m('name="description"',D.de);
if(D.ur)a('<link rel="canonical" href="'+esc(D.ur)+'">');
m('name="robots"',D.idx?"index, follow":"noindex, nofollow");
a('<meta property="og:type" content="website">');
if(D.ti)m('property="og:title"',D.ti);if(D.de)m('property="og:description"',D.de);
if(D.ur)m('property="og:url"',D.ur);if(D.sn)m('property="og:site_name"',D.sn);if(D.im)m('property="og:image"',D.im);
m('property="og:locale"',D.lc||defLoc());
m('name="twitter:card"',D.im?"summary_large_image":"summary");
if(D.ti)m('name="twitter:title"',D.ti);if(D.de)m('name="twitter:description"',D.de);if(D.im)m('name="twitter:image"',D.im);
Object.keys(VF).forEach(k=>{if(D[k])m('name="'+VF[k][1]+'"',D[k])});
return L.join("\n")}
/*ENDGEN*/
function draw(){
const t=D.ti,d=D.de;let host=D.ur,path="";
try{const x=new URL(D.ur);host=x.host;path=x.pathname.split("/").filter(Boolean).join(" › ")}catch(e){}
$("pvt").textContent=t.length>60?t.slice(0,57)+"…":t;$("pvu").textContent=host+(path?" › "+path:"");$("pvd").textContent=d.length>160?d.slice(0,157)+"…":d;
$("ct").textContent=numTxt(t.length)+" / "+numTxt(60);$("cd").textContent=numTxt(d.length)+" / "+numTxt(160);
$("mt").textContent=t.length>60?T(13):(t.length&&t.length<30?T(14):"");
$("md").textContent=d.length>160?T(13):(d.length&&d.length<70?T(14):"");
const g=gen();$("out").value=g;$("out").rows=Math.min(24,g.split("\n").length+1)}
const IDS=["ti","de","ur","sn","im","lc","vg","vb","vy","vz","vn"],LB={ti:1,de:2,ur:3,sn:4,im:5,lc:6};
function vis(){Object.keys(VF).forEach(k=>{const rel=k==="vg"||k==="vb"||LOCAL[ET.state.country]===k;$("w_"+k).hidden=!(rel||D[k])})}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
Object.keys(LB).forEach(k=>{$("l_"+k).textContent=T(LB[k])});
$("lidx").textContent=T(7);$("h8").textContent=T(8);$("h9").textContent=T(9);$("cp").textContent=T(10);$("h12").textContent=T(12);
Object.keys(VF).forEach(k=>{$("l_"+k).textContent=VF[k][0]});
if(!D.ov.lc)$("lc").value=defLoc();else $("lc").value=D.lc;
$("lc").placeholder=defLoc();$("idx").checked=D.idx;vis();draw()}
IDS.forEach(k=>{const i=$(k);i.value=D[k]||"";i.addEventListener("input",()=>{D[k]=i.value;if(k==="lc")D.ov.lc=1;save();vis();draw()})});
$("idx").onchange=e=>{D.idx=e.target.checked;save();draw()};
$("cp").onclick=async()=>{const v=$("out").value;try{await navigator.clipboard.writeText(v)}catch(e){$("out").select();try{document.execCommand("copy")}catch(x){}}
$("cp").textContent=T(11);setTimeout(()=>{$("cp").textContent=T(10)},1500);ET.logNow(T(0)+": "+(D.ti||"—"))};
ET.start({id:"seo",file:"seo.html",S,S2,labels,guide:()=>ET.t2(0),warn:()=>T(15),currency:false});
</script>
</body>
</html>
