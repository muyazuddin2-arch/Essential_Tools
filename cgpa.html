const n=parseFloat(s);return isFinite(n)&&n>=0?n:0}
const nf=x=>{try{return new Intl.NumberFormat(ET.state.lang,{minimumFractionDigits:2,maximumFractionDigits:2}).format(x)}catch(e){return x.toFixed(2)}};

if(!v){big.textContent="";return}
