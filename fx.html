uk:"Конвертер валют|Сума|З|У|Поміняти|Курси оновлено|Завантаження курсів валют…|Не вдалося завантажити курси валют. Перевірте підключення до інтернету й спробуйте ще раз.|Спробувати ще раз|Правило щодо готівки в поїздці|Готівку понад {a} зазвичай потрібно декларувати митниці під час в’їзду чи виїзду ({c}).|У багатьох країнах готівку понад приблизно 10 000 USD або EUR потрібно декларувати на митниці. Перед поїздкою з готівкою перевірте правила своєї країни.|Показано орієнтовні середні ринкові курси, а не курси банків чи обмінних пунктів, які містять комісії та маржу. Перед будь-якою операцією уточніть у банку. Ліміти на готівку мають загальний довідковий характер і можуть змінюватися.|Курс обміну",
id:"Konverter Mata Uang|Jumlah|Dari|Ke|Tukar|Kurs diperbarui|Memuat kurs…|Kurs tidak dapat dimuat. Periksa koneksi internet Anda dan coba lagi.|Coba lagi|Aturan uang tunai saat bepergian|Uang tunai di atas {a} biasanya harus dilaporkan ke bea cukai saat masuk atau keluar dari {c}.|Banyak negara mewajibkan deklarasi bea cukai untuk uang tunai di atas sekitar 10.000 USD atau EUR. Periksa aturan negara Anda sebelum bepergian membawa uang tunai.|Kurs yang ditampilkan adalah kurs tengah pasar sebagai acuan, bukan kurs bank atau tempat penukaran yang memuat biaya dan margin. Konfirmasikan ke bank Anda sebelum bertransaksi. Batas uang tunai adalah panduan umum dan dapat berubah.|Kurs",
ms:"Penukar Mata Wang|Jumlah|Daripada|Kepada|Tukar|Kadar dikemas kini|Memuatkan kadar pertukaran…|Kadar pertukaran tidak dapat dimuatkan. Semak sambungan internet anda dan cuba lagi.|Cuba lagi|Peraturan wang tunai semasa melancong|Wang tunai melebihi {a} biasanya mesti diisytiharkan kepada kastam semasa masuk atau keluar dari {c}.|Banyak negara memerlukan pengisytiharan kastam untuk wang tunai melebihi kira-kira 10,000 USD atau EUR. Semak peraturan negara anda sebelum melancong dengan wang tunai.|Kadar yang dipaparkan ialah kadar pasaran pertengahan sebagai panduan, bukan kadar bank atau kedai pertukaran wang yang termasuk yuran dan margin. Sahkan dengan bank anda sebelum sebarang transaksi. Had wang tunai ialah panduan umum dan boleh berubah.|Kadar pertukaran",
th:"ตัวแปลงสกุลเงิน|จำนวนเงิน|จาก|เป็น|สลับ|อัตราอัปเดตเมื่อ|กำลังโหลดอัตราแลกเปลี่ยน…|โหลดอัตราแลกเปลี่ยนไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง|ลองอีกครั้ง|กฎเรื่องเงินสดเมื่อเดินทาง|เงินสดเกิน {a} มักต้องสำแดงต่อศุลกากรเมื่อเข้าหรือออก {c}|หลายประเทศกำหนดให้สำแดงศุลกากรสำหรับเงินสดที่เกินประมาณ 10,000 USD หรือ EUR ตรวจสอบกฎของประเทศคุณก่อนเดินทางพร้อมเงินสด|อัตราที่แสดงเป็นอัตราตลาดกลางโดยประมาณ ไม่ใช่อัตราของธนาคารหรือร้านแลกเงินที่มีค่าธรรมเนียมและส่วนต่าง โปรดยืนยันกับธนาคารก่อนทำธุรกรรม ขีดจำกัดเงินสดเป็นเพียงแนวทางทั่วไปและอาจเปลี่ยนแปลง|อัตราแลกเปลี่ยน",
vi:"Đổi tiền tệ|Số tiền|Từ|Sang|Đảo chiều|Tỷ giá cập nhật|Đang tải tỷ giá…|Không tải được tỷ giá. Kiểm tra kết nối internet và thử lại.|Thử lại|Quy định về tiền mặt khi đi du lịch|Tiền mặt trên {a} thường phải khai báo hải quan khi nhập cảnh hoặc xuất cảnh ({c}).|Nhiều quốc gia yêu cầu khai báo hải quan với tiền mặt trên khoảng 10.000 USD hoặc EUR. Hãy xem quy định của nước bạn trước khi mang tiền mặt đi du lịch.|Tỷ giá hiển thị là tỷ giá trung bình thị trường mang tính tham khảo, không phải tỷ giá của ngân hàng hay tiệm đổi tiền vốn có phí và chênh lệch. Hãy xác nhận với ngân hàng trước mọi giao dịch. Hạn mức tiền mặt chỉ là hướng dẫn chung và có thể thay đổi.|Tỷ giá",
ta:"நாணய மாற்றி|தொகை|இதிலிருந்து|இதற்கு|மாற்று|விகிதங்கள் புதுப்பிக்கப்பட்டவை|செலாவணி விகிதங்கள் ஏற்றப்படுகின்றன…|செலாவணி விகிதங்களை ஏற்ற முடியவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.|மீண்டும் முயல்|பயணத்தில் ரொக்க விதி|{c} நாட்டுக்குள் நுழையும்போதோ வெளியேறும்போதோ {a}க்கு மேற்பட்ட ரொக்கத்தை பொதுவாக சுங்கத்துறையிடம் அறிவிக்க வேண்டும்.|பல நாடுகளில் ஏறக்குறைய 10,000 USD அல்லது EUR-க்கு மேற்பட்ட ரொக்கத்துக்கு சுங்க அறிவிப்பு தேவை. ரொக்கத்துடன் பயணிக்கும் முன் உங்கள் நாட்டின் விதிகளைப் பாருங்கள்.|காட்டப்படும் விகிதங்கள் தோராய சந்தை நடுவிகிதங்கள்; கட்டணமும் மார்ஜினும் சேர்ந்த வங்கி அல்லது பணமாற்று கடை விகிதங்கள் அல்ல. எந்தப் பரிவர்த்தனைக்கும் முன் வங்கியிடம் உறுதிசெய்யவும். ரொக்க வரம்புகள் பொது வழிகாட்டுதல் மட்டுமே; மாறலாம்.|செலாவணி விகிதம்",
te:"కరెన్సీ కన్వర్టర్|మొత్తం|నుండి|కు|మార్చు|రేట్లు నవీకరించబడ్డాయి|మార్పిడి రేట్లు లోడ్ అవుతున్నాయి…|మార్పిడి రేట్లను లోడ్ చేయలేకపోయాం. ఇంటర్నెట్ కనెక్షన్ చూసి మళ్లీ ప్రయత్నించండి.|మళ్లీ ప్రయత్నించు|ప్రయాణంలో నగదు నియమం|{c}లోకి ప్రవేశించేటప్పుడు లేదా బయలుదేరేటప్పుడు {a} కంటే ఎక్కువ నగదును సాధారణంగా కస్టమ్స్‌కు ప్రకటించాలి.|చాలా దేశాల్లో సుమారు 10,000 USD లేదా EUR కంటే ఎక్కువ నగదుకు కస్టమ్స్ ప్రకటన అవసరం. నగదుతో ప్రయాణించే ముందు మీ దేశ నియమాలు చూడండి.|చూపిన రేట్లు సుమారు మార్కెట్ మధ్య రేట్లు; ఫీజులు, మార్జిన్లు ఉండే బ్యాంకు లేదా ఎక్స్ఛేంజ్ రేట్లు కావు. ఏ లావాదేవీకైనా ముందు బ్యాంకుతో నిర్ధారించుకోండి. నగదు పరిమితులు సాధారణ మార్గదర్శకాలు మాత్రమే, మారవచ్చు.|మార్పిడి రేటు",
mr:"चलन परिवर्तक|रक्कम|पासून|मध्ये|अदलाबदल|दर अद्ययावत|विनिमय दर लोड होत आहेत…|विनिमय दर लोड करता आले नाहीत. इंटरनेट कनेक्शन तपासून पुन्हा प्रयत्न करा.|पुन्हा प्रयत्न करा|प्रवासातील रोख रकमेचा नियम|{c} मध्ये प्रवेश करताना किंवा बाहेर पडताना {a} पेक्षा जास्त रोख रक्कम सहसा सीमाशुल्क विभागाला जाहीर करावी लागते.|अनेक देशांत सुमारे 10,000 USD किंवा EUR पेक्षा जास्त रोख रकमेसाठी सीमाशुल्क घोषणा आवश्यक असते. रोख घेऊन प्रवास करण्यापूर्वी तुमच्या देशाचे नियम तपासा.|दाखवलेले दर अंदाजे मध्य-बाजार दर आहेत, शुल्क आणि मार्जिन असलेले बँक किंवा एक्स्चेंजचे दर नव्हेत. कोणत्याही व्यवहारापूर्वी बँकेकडून खात्री करा. रोख मर्यादा सामान्य मार्गदर्शन आहे आणि बदलू शकते.|विनिमय दर",
ne:"मुद्रा रूपान्तरणकर्ता|रकम|बाट|मा|साटासाट|दर अद्यावधिक भएको|विनिमय दर लोड हुँदैछ…|विनिमय दर लोड गर्न सकिएन। इन्टरनेट जडान जाँचेर फेरि प्रयास गर्नुहोस्।|फेरि प्रयास गर्नुहोस्|यात्रामा नगद सम्बन्धी नियम|{c} मा प्रवेश गर्दा वा बाहिर निस्कँदा {a} भन्दा बढी नगद सामान्यतया भन्सारमा घोषणा गर्नुपर्छ।|धेरै देशमा करिब 10,000 USD वा EUR भन्दा बढी नगदका लागि भन्सार घोषणा चाहिन्छ। नगद लिएर यात्रा गर्नुअघि आफ्नो देशका नियम हेर्नुहोस्।|देखाइएका दर अनुमानित मध्य-बजार दर हुन्, शुल्क र मार्जिन समावेश बैंक वा एक्सचेन्जका दर होइनन्। कुनै पनि कारोबारअघि बैंकसँग पुष्टि गर्नुहोस्। नगद सीमा सामान्य मार्गदर्शन हो र परिवर्तन हुन सक्छ।|विनिमय दर",
si:"මුදල් පරිවර්තකය|මුදල|සිට|වෙත|මාරු කරන්න|අනුපාත යාවත්කාලීන වූ වේලාව|විනිමය අනුපාත පූරණය වෙමින්…|විනිමය අනුපාත පූරණය කළ නොහැකි විය. අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කර නැවත උත්සාහ කරන්න.|නැවත උත්සාහ කරන්න|ගමන් අතරතුර මුදල් නීතිය|{c} වෙත ඇතුළු වන විට හෝ පිටවන විට {a} ට වඩා වැඩි මුදල් සාමාන්‍යයෙන් රේගුවට ප්‍රකාශ කළ යුතුය.|බොහෝ රටවල ආසන්න වශයෙන් 10,000 USD හෝ EUR ට වැඩි මුදල් සඳහා රේගු ප්‍රකාශයක් අවශ්‍ය වේ. මුදල් රැගෙන ගමන් කිරීමට පෙර ඔබේ රටේ නීති පරීක්ෂා කරන්න.|පෙන්වන අනුපාත ආසන්න වෙළඳපොළ මධ්‍යම අනුපාත වන අතර, ගාස්තු සහ ආන්තික ඇතුළත් බැංකු හෝ මුදල් මාරු කඩවල අනුපාත නොවේ. ඕනෑම ගනුදෙනුවකට පෙර ඔබේ බැංකුවෙන් තහවුරු කරගන්න. මුදල් සීමා සාමාන්‍ය මග පෙන්වීමක් පමණක් වන අතර වෙනස් විය හැක.|විනිමය අනුපාතය",
sw:"Kigeuza Sarafu|Kiasi|Kutoka|Kwenda|Badilishana|Viwango vimesasishwa|Inapakia viwango vya ubadilishaji…|Imeshindwa kupakia viwango vya ubadilishaji. Angalia muunganisho wa intaneti kisha jaribu tena.|Jaribu tena|Kanuni ya fedha taslimu safarini|Fedha taslimu zaidi ya {a} kwa kawaida lazima zitangazwe forodhani unapoingia au kutoka {c}.|Nchi nyingi zinahitaji tamko la forodha kwa fedha taslimu zaidi ya takriban USD au EUR 10,000. Angalia kanuni za nchi yako kabla ya kusafiri na fedha taslimu.|Viwango vinavyoonyeshwa ni viwango elekezi vya soko la kati, si vile vya benki au maduka ya kubadilisha fedha vyenye ada na pembe ya faida. Thibitisha na benki yako kabla ya muamala wowote. Vikomo vya fedha taslimu ni mwongozo wa jumla na vinaweza kubadilika.|Kiwango cha ubadilishaji",
he:"ממיר מטבעות|סכום|מ־|ל־|החלף|השערים עודכנו|טוען שערי חליפין…|לא ניתן לטעון שערי חליפין. בדקו את חיבור האינטרנט ונסו שוב.|נסו שוב|כלל המזומן בנסיעה|מזומן מעל {a} חייב בדרך כלל בהצהרה למכס בעת כניסה או יציאה ({c}).|מדינות רבות דורשות הצהרה למכס על מזומן מעל כ-10,000 USD או EUR. בדקו את כללי מדינתכם לפני נסיעה עם מזומן.|השערים המוצגים הם שערי אמצע שוק מכוונים, לא השערים של בנקים או חנויות המרה הכוללים עמלות ומרווחים. אשרו מול הבנק לפני כל עסקה. מגבלות המזומן הן הנחיה כללית ועשויות להשתנות.|שער חליפין",
el:"Μετατροπέας νομισμάτων|Ποσό|Από|Σε|Αντιστροφή|Οι τιμές ενημερώθηκαν|Φόρτωση ισοτιμιών…|Δεν ήταν δυνατή η φόρτωση των ισοτιμιών. Ελέγξτε τη σύνδεσή σας στο διαδίκτυο και δοκιμάστε ξανά.|Δοκιμάστε ξανά|Κανόνας για μετρητά σε ταξίδι|Τα μετρητά πάνω από {a} συνήθως πρέπει να δηλώνονται στο τελωνείο κατά την είσοδο ή έξοδο ({c}).|Πολλές χώρες απαιτούν τελωνειακή δήλωση για μετρητά πάνω από περίπου 10.000 USD ή EUR. Ελέγξτε τους κανόνες της χώρας σας πριν ταξιδέψετε με μετρητά.|Οι ισοτιμίες που εμφανίζονται είναι ενδεικτικές μέσες τιμές αγοράς, όχι αυτές των τραπεζών ή των γραφείων συναλλάγματος, που περιλαμβάνουν χρεώσεις και περιθώρια. Επιβεβαιώστε με την τράπεζά σας πριν από κάθε συναλλαγή. Τα όρια μετρητών είναι γενική καθοδήγηση και μπορεί να αλλάξουν.|Ισοτιμία",
sv:"Valutaomvandlare|Belopp|Från|Till|Växla|Kurser uppdaterade|Hämtar växelkurser…|Det gick inte att hämta växelkurser. Kontrollera din internetanslutning och försök igen.|Försök igen|Kontantregel vid resa|Kontanter över {a} måste vanligtvis deklareras till tullen vid in- eller utresa ({c}).|Många länder kräver tulldeklaration för kontanter över cirka 10 000 USD eller EUR. Kontrollera reglerna i ditt land innan du reser med kontanter.|De visade kurserna är vägledande mittkurser, inte vad banker eller växlingskontor tar, som inkluderar avgifter och marginaler. Bekräfta med din bank före varje transaktion. Kontantgränser är allmän vägledning och kan ändras.|Växelkurs"};

en:"Enter an amount, pick the two currencies and the result updates at once. Use the swap button to reverse them. If you allow your location, your language, currency and country rules are set automatically; you can also change them above. Rates need an internet connection and come from free public sources, updated about once a day. Your history stays only until you leave this page.",
bn:"পরিমাণ লিখুন, দুটি মুদ্রা বেছে নিন, ফল সঙ্গে সঙ্গে দেখা যাবে। উল্টে দিতে অদলবদল বোতাম চাপুন। লোকেশনের অনুমতি দিলে ভাষা, মুদ্রা ও দেশের নিয়ম নিজে থেকেই সেট হবে; ওপর থেকে নিজেও বদলাতে পারবেন। রেট পেতে ইন্টারনেট লাগে এবং তা বিনামূল্যের সর্বজনীন উৎস থেকে আসে, প্রায় দিনে একবার হালনাগাদ হয়। এই পেজ ছাড়লে আপনার ইতিহাস মুছে যায়।",
hi:"राशि लिखें, दो मुद्राएँ चुनें, नतीजा तुरंत दिखेगा। उलटने के लिए अदला-बदली बटन दबाएँ। स्थान की अनुमति देने पर भाषा, मुद्रा और देश के नियम अपने-आप सेट हो जाते हैं; आप ऊपर से बदल भी सकते हैं। दरों के लिए इंटरनेट चाहिए और वे मुफ़्त सार्वजनिक स्रोतों से आती हैं, लगभग दिन में एक बार अपडेट होती हैं। इस पेज को छोड़ने तक ही आपका इतिहास रहता है।",
ur:"رقم لکھیں، دو کرنسیاں چنیں، نتیجہ فوراً نظر آئے گا۔ الٹنے کے لیے ادلا بدلی کا بٹن دبائیں۔ مقام کی اجازت دینے پر زبان، کرنسی اور ملک کے قواعد خود بخود سیٹ ہو جاتے ہیں؛ آپ اوپر سے بدل بھی سکتے ہیں۔ ریٹس کے لیے انٹرنیٹ درکار ہے اور وہ مفت عوامی ذرائع سے آتے ہیں، تقریباً دن میں ایک بار اپڈیٹ ہوتے ہیں۔ آپ کی ہسٹری اس صفحے سے نکلنے تک ہی رہتی ہے۔",
ar:"أدخل مبلغًا واختر عملتين فتظهر النتيجة فورًا. استخدم زر التبديل لعكس العملتين. إذا سمحت بالوصول إلى موقعك تُضبط اللغة والعملة وقواعد الدولة تلقائيًا، ويمكنك أيضًا تغييرها من الأعلى. تحتاج الأسعار إلى اتصال بالإنترنت وتأتي من مصادر عامة مجانية وتُحدَّث نحو مرة يوميًا. يبقى سجلك حتى تغادر هذه الصفحة فقط.",
fa:"مبلغ را وارد کنید، دو ارز را انتخاب کنید و نتیجه بلافاصله نمایش داده می‌شود. برای معکوس کردن از دکمه جابه‌جایی استفاده کنید. اگر اجازه دسترسی به موقعیت بدهید، زبان، ارز و قوانین کشور خودکار تنظیم می‌شود؛ از بالا هم می‌توانید تغییر دهید. نرخ‌ها به اینترنت نیاز دارند و از منابع عمومی رایگان می‌آیند و تقریباً روزی یک بار به‌روز می‌شوند. تاریخچه شما فقط تا ترک این صفحه می‌ماند.",
tr:"Bir tutar girin, iki para birimini seçin, sonuç anında güncellenir. Ters çevirmek için değiştir düğmesini kullanın. Konumunuza izin verirseniz dil, para birimi ve ülke kuralları otomatik ayarlanır; yukarıdan da değiştirebilirsiniz. Kurlar internet bağlantısı gerektirir, ücretsiz kamuya açık kaynaklardan gelir ve günde yaklaşık bir kez güncellenir. Geçmişiniz yalnızca bu sayfadan ayrılana kadar saklanır.",
zh:"输入金额并选择两种货币，结果会立即更新。点击互换按钮可调换两者。若允许获取位置，语言、货币和国家规则会自动设置，您也可以在上方更改。汇率需要联网，来自免费公开数据源，约每天更新一次。历史记录仅保留到您离开此页面为止。",
ja:"金額を入力して2つの通貨を選ぶと、結果がすぐに更新されます。入れ替えボタンで元と先を逆にできます。位置情報を許可すると、言語・通貨・国のルールが自動で設定され、上部から変更もできます。レートはインターネット接続が必要で、無料の公開データから取得し、1日に1回ほど更新されます。履歴はこのページを離れるまでしか保存されません。",
ko:"금액을 입력하고 두 통화를 고르면 결과가 바로 갱신됩니다. 바꾸기 버튼으로 서로 맞바꿀 수 있습니다. 위치를 허용하면 언어, 통화, 국가 규정이 자동으로 설정되며 위에서 직접 바꿀 수도 있습니다. 환율은 인터넷 연결이 필요하고 무료 공개 데이터에서 가져오며 하루에 한 번쯤 갱신됩니다. 기록은 이 페이지를 떠날 때까지만 유지됩니다.",
ru:"Введите сумму, выберите две валюты, и результат обновится сразу. Кнопка «Поменять» меняет их местами. Если разрешить доступ к местоположению, язык, валюта и правила страны настроятся автоматически; их можно изменить выше. Для курсов нужен интернет, они берутся из бесплатных открытых источников и обновляются примерно раз в сутки. История хранится только до ухода со страницы.",
es:"Introduce una cantidad, elige las dos divisas y el resultado se actualiza al instante. Usa el botón de intercambio para invertirlas. Si permites tu ubicación, el idioma, la moneda y las reglas del país se configuran solos; también puedes cambiarlos arriba. Los tipos requieren conexión a internet, proceden de fuentes públicas gratuitas y se actualizan aproximadamente una vez al día. Tu historial se conserva solo hasta que salgas de esta página.",
fr:"Saisissez un montant, choisissez les deux devises et le résultat se met à jour aussitôt. Utilisez le bouton d’inversion pour les échanger. Si vous autorisez votre position, la langue, la devise et les règles du pays se règlent automatiquement ; vous pouvez aussi les modifier ci-dessus. Les taux nécessitent une connexion internet, viennent de sources publiques gratuites et sont mis à jour environ une fois par jour. Votre historique n’est conservé que jusqu’à votre départ de cette page.",
de:"Geben Sie einen Betrag ein und wählen Sie zwei Währungen, das Ergebnis aktualisiert sich sofort. Mit der Tauschen-Taste kehren Sie sie um. Wenn Sie Ihren Standort erlauben, werden Sprache, Währung und Länderregeln automatisch eingestellt; oben können Sie sie auch ändern. Die Kurse benötigen eine Internetverbindung, stammen aus kostenlosen öffentlichen Quellen und werden etwa einmal täglich aktualisiert. Ihr Verlauf bleibt nur, bis Sie diese Seite verlassen.",
pt:"Digite um valor, escolha as duas moedas e o resultado é atualizado na hora. Use o botão de inverter para trocá-las. Se você permitir sua localização, idioma, moeda e regras do país são definidos automaticamente; você também pode alterá-los acima. As taxas exigem conexão com a internet, vêm de fontes públicas gratuitas e são atualizadas cerca de uma vez por dia. Seu histórico fica apenas até você sair desta página.",
it:"Inserisci un importo, scegli le due valute e il risultato si aggiorna subito. Usa il pulsante Inverti per scambiarle. Se consenti la posizione, lingua, valuta e regole del paese si impostano da sole; puoi anche cambiarle qui sopra. I tassi richiedono una connessione a internet, provengono da fonti pubbliche gratuite e sono aggiornati circa una volta al giorno. La cronologia resta solo finché non lasci questa pagina.",
nl:"Voer een bedrag in, kies de twee valuta’s en het resultaat wordt direct bijgewerkt. Gebruik de knop Omwisselen om ze om te draaien. Als u uw locatie toestaat, worden taal, valuta en landregels automatisch ingesteld; u kunt ze ook hierboven wijzigen. Koersen vereisen een internetverbinding, komen uit gratis openbare bronnen en worden ongeveer eens per dag bijgewerkt. Uw geschiedenis blijft alleen bewaard tot u deze pagina verlaat.",
pl:"Wpisz kwotę, wybierz dwie waluty, a wynik zaktualizuje się od razu. Przycisk Zamień odwraca waluty. Jeśli zezwolisz na lokalizację, język, waluta i zasady kraju ustawią się automatycznie; możesz też zmienić je powyżej. Kursy wymagają połączenia z internetem, pochodzą z bezpłatnych publicznych źródeł i są aktualizowane mniej więcej raz dziennie. Historia jest przechowywana tylko do opuszczenia strony.",
uk:"Введіть суму, виберіть дві валюти, і результат оновиться одразу. Кнопка «Поміняти» міняє їх місцями. Якщо дозволити доступ до місцезнаходження, мова, валюта та правила країни налаштуються автоматично; їх можна змінити вище. Для курсів потрібен інтернет, вони беруться з безкоштовних відкритих джерел і оновлюються приблизно раз на добу. Історія зберігається лише до виходу зі сторінки.",
id:"Masukkan jumlah, pilih dua mata uang, dan hasil langsung diperbarui. Gunakan tombol tukar untuk membaliknya. Jika Anda mengizinkan lokasi, bahasa, mata uang, dan aturan negara diatur otomatis; Anda juga bisa mengubahnya di atas. Kurs memerlukan koneksi internet, berasal dari sumber publik gratis, dan diperbarui sekitar sekali sehari. Riwayat Anda hanya disimpan sampai Anda meninggalkan halaman ini.",
ms:"Masukkan jumlah, pilih dua mata wang dan hasilnya dikemas kini serta-merta. Gunakan butang tukar untuk menterbalikkannya. Jika anda membenarkan lokasi, bahasa, mata wang dan peraturan negara ditetapkan secara automatik; anda juga boleh mengubahnya di atas. Kadar memerlukan sambungan internet, datang daripada sumber awam percuma dan dikemas kini kira-kira sekali sehari. Sejarah anda hanya disimpan sehingga anda meninggalkan halaman ini.",
th:"ใส่จำนวนเงิน เลือกสองสกุลเงิน ผลลัพธ์จะอัปเดตทันที ใช้ปุ่มสลับเพื่อกลับด้าน หากอนุญาตตำแหน่ง ภาษา สกุลเงิน และกฎของประเทศจะตั้งค่าให้อัตโนมัติ และคุณเปลี่ยนเองด้านบนได้ อัตราต้องใช้อินเทอร์เน็ต มาจากแหล่งข้อมูลสาธารณะฟรี และอัปเดตประมาณวันละครั้ง ประวัติของคุณจะอยู่จนกว่าคุณจะออกจากหน้านี้เท่านั้น",
vi:"Nhập số tiền, chọn hai loại tiền và kết quả cập nhật ngay. Dùng nút đảo chiều để đổi chỗ chúng. Nếu bạn cho phép vị trí, ngôn ngữ, tiền tệ và quy tắc quốc gia sẽ tự đặt; bạn cũng có thể đổi ở trên. Tỷ giá cần kết nối internet, lấy từ nguồn công khai miễn phí và cập nhật khoảng một lần mỗi ngày. Lịch sử của bạn chỉ được giữ cho đến khi bạn rời trang này.",
ta:"தொகையை உள்ளிட்டு இரு நாணயங்களைத் தேர்ந்தெடுத்தால் முடிவு உடனே புதுப்பிக்கப்படும். அவற்றை மாற்ற மாற்று பொத்தானை அழுத்தவும். இருப்பிட அனுமதி தந்தால் மொழி, நாணயம், நாட்டு விதிகள் தானாக அமையும்; மேலே நீங்களும் மாற்றலாம். விகிதங்களுக்கு இணையம் தேவை; அவை இலவச பொது மூலங்களிலிருந்து வந்து தினமும் ஒருமுறை அளவில் புதுப்பிக்கப்படும். இந்தப் பக்கத்தை விட்டுச் செல்லும் வரை மட்டுமே உங்கள் வரலாறு இருக்கும்.",
te:"మొత్తం నమోదు చేసి రెండు కరెన్సీలను ఎంచుకుంటే ఫలితం వెంటనే నవీకరించబడుతుంది. వాటిని తిప్పడానికి మార్చు బటన్ వాడండి. స్థానానికి అనుమతిస్తే భాష, కరెన్సీ, దేశ నియమాలు ఆటోమేటిక్‌గా సెట్ అవుతాయి; పైన మీరు కూడా మార్చవచ్చు. రేట్లకు ఇంటర్నెట్ కావాలి; అవి ఉచిత పబ్లిక్ మూలాల నుండి వస్తాయి, రోజుకు సుమారు ఒకసారి నవీకరించబడతాయి. ఈ పేజీని వదిలే వరకే మీ చరిత్ర ఉంటుంది.",
mr:"रक्कम लिहा, दोन चलने निवडा, निकाल लगेच अद्ययावत होतो. उलट करण्यासाठी अदलाबदल बटण दाबा. स्थानाची परवानगी दिल्यास भाषा, चलन आणि देशाचे नियम आपोआप सेट होतात; वरून तुम्ही बदलूही शकता. दरांसाठी इंटरनेट लागते, ते मोफत सार्वजनिक स्रोतांमधून येतात आणि साधारण दिवसातून एकदा अद्ययावत होतात. हे पान सोडेपर्यंतच तुमचा इतिहास राहतो.",
ne:"रकम लेख्नुहोस्, दुई मुद्रा छान्नुहोस्, नतिजा तुरुन्तै अद्यावधिक हुन्छ। उल्टाउन साटासाट बटन थिच्नुहोस्। स्थानको अनुमति दिएमा भाषा, मुद्रा र देशका नियम आफैँ सेट हुन्छन्; माथिबाट तपाईं बदल्न पनि सक्नुहुन्छ। दरका लागि इन्टरनेट चाहिन्छ, ती निःशुल्क सार्वजनिक स्रोतबाट आउँछन् र करिब दिनमा एकपटक अद्यावधिक हुन्छन्। यो पेज छोडेसम्म मात्र तपाईंको इतिहास रहन्छ।",
si:"මුදල ඇතුළත් කර මුදල් ඒකක දෙකක් තෝරන්න, ප්‍රතිඵලය වහාම යාවත්කාලීන වේ. ඒවා මාරු කිරීමට මාරු කරන්න බොත්තම භාවිතා කරන්න. ස්ථානයට ඉඩ දුන්නොත් භාෂාව, මුදල් සහ රටේ නීති ස්වයංක්‍රීයව සැකසේ; ඉහළින් ඔබටත් වෙනස් කළ හැක. අනුපාත සඳහා අන්තර්ජාලය අවශ්‍යයි, ඒවා නොමිලේ පොදු මූලාශ්‍රවලින් එන අතර දිනකට වරක් පමණ යාවත්කාලීන වේ. මෙම පිටුවෙන් ඉවත් වන තෙක් පමණක් ඔබේ ඉතිහාසය පවතී.",
sw:"Weka kiasi, chagua sarafu mbili na matokeo yanasasishwa mara moja. Tumia kitufe cha kubadilishana kuzigeuza. Ukiruhusu eneo lako, lugha, sarafu na kanuni za nchi huwekwa kiotomatiki; unaweza pia kuzibadilisha hapo juu. Viwango vinahitaji intaneti, vinatoka vyanzo vya umma visivyo na malipo na husasishwa takriban mara moja kwa siku. Historia yako hubaki hadi utakapoondoka kwenye ukurasa huu tu.",
he:"הזינו סכום, בחרו שני מטבעות והתוצאה תתעדכן מיד. כפתור ההחלפה הופך ביניהם. אם תאפשרו גישה למיקום, השפה, המטבע וכללי המדינה יוגדרו אוטומטית; אפשר גם לשנות אותם למעלה. השערים דורשים חיבור לאינטרנט, מגיעים ממקורות ציבוריים חינמיים ומתעדכנים בערך פעם ביום. ההיסטוריה נשמרת רק עד שתעזבו את הדף.",
el:"Εισαγάγετε ποσό, επιλέξτε δύο νομίσματα και το αποτέλεσμα ενημερώνεται αμέσως. Χρησιμοποιήστε το κουμπί αντιστροφής για να τα αλλάξετε. Αν επιτρέψετε την τοποθεσία σας, η γλώσσα, το νόμισμα και οι κανόνες της χώρας ορίζονται αυτόματα· μπορείτε και να τα αλλάξετε παραπάνω. Οι ισοτιμίες χρειάζονται σύνδεση στο διαδίκτυο, προέρχονται από δωρεάν δημόσιες πηγές και ενημερώνονται περίπου μία φορά την ημέρα. Το ιστορικό σας διατηρείται μόνο μέχρι να φύγετε από τη σελίδα.",
sv:"Ange ett belopp, välj de två valutorna så uppdateras resultatet direkt. Använd växlingsknappen för att byta plats på dem. Om du tillåter din plats ställs språk, valuta och landsregler in automatiskt; du kan också ändra dem ovan. Kurserna kräver internetanslutning, kommer från gratis offentliga källor och uppdateras ungefär en gång per dag. Din historik sparas bara tills du lämnar sidan."};

const $=id=>document.getElementById(id),T=k=>ET.t(k);
/* more currencies than languages (rule: at least one per language). Names come from the browser in the active language. */
const CL=["USD","EUR","GBP","JPY","CNY","INR","BDT","PKR","NPR","LKR","SAR","AED","TRY","RUB","KRW","IDR","MYR","THB","VND","BRL","MXN","PLN","UAH","SEK","ILS","IRR","EGP","KES","ZAR","AUD","CAD","SGD","CHF","NGN","KZT","HKD","TWD","NZD","DKK","NOK","CZK","HUF","RON","BGN","ISK","CLP","COP","ARS","PEN","MAD","DZD","QAR","KWD","BHD","OMR","JOD","ETB","GHS","TZS","UGX","MMK","KHR","BTN","MVR","AFN","UZS","GEL","AMD","AZN","RSD"];
/* General customs cash-declaration thresholds [currency, amount]. Guidance only; the page warns users to confirm with customs. */
const EU=[["EUR",10000]];
const RULE={US:[["USD",10000]],CA:[["CAD",10000]],GB:[["GBP",10000]],IE:EU,AU:[["AUD",10000]],DE:EU,AT:EU,FR:EU,ES:EU,IT:EU,NL:EU,GR:EU,PL:EU,SE:EU,CH:[["CHF",10000]],TR:[["EUR",10000]],RU:[["USD",10000]],CN:[["CNY",20000],["USD",5000]],JP:[["JPY",1000000]],KR:[["USD",10000]],SA:[["SAR",60000]],AE:[["AED",60000]],EG:[["USD",10000]],IL:[["ILS",50000]],ID:[["IDR",100000000]],MY:[["USD",10000]],SG:[["SGD",20000]],TH:[["USD",20000]],VN:[["USD",5000]],BR:[["BRL",10000]],MX:[["USD",10000]],KE:[["USD",10000]],NG:[["USD",10000]],BD:[["USD",5000]],IN:[["USD",5000]]};
let D={am:"1",from:"",to:"",ov:{}},R=null;
const dn=(c,t)=>{try{return new Intl.DisplayNames([ET.state.lang],{type:t}).of(c)||c}catch(e){return c}};
/* accepts Arabic-Indic, Persian, Devanagari and Bengali digits; comma or dot as decimal mark */
function num(v){let s=String(v||"").trim().replace(/\s/g,"");
s=s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x6F0).replace(/[\u0966-\u096F]/g,c=>c.charCodeAt(0)-0x966).replace(/[\u09E6-\u09EF]/g,c=>c.charCodeAt(0)-0x9E6).replace(/\u066B/g,".").replace(/\u066C/g,",");
if(s.includes(",")&&s.includes("."))s=s.replace(/,/g,"");else s=s.replace(",",".");
const n=parseFloat(s);return isFinite(n)&&n>=0?n:0}
const ad=x=>x>=1||x===0?{}:x>=0.01?{maximumFractionDigits:4}:{maximumFractionDigits:8};
function fillSel(){
[["fr","from"],["to","to"]].forEach(p=>{const s=$(p[0]);
s.innerHTML=CL.map(c=>'<option value="'+c+'">'+c+" – "+dn(c,"currency")+'</option>').join("");s.value=D[p[1]]})}
function preset(){
if(!D.ov.from)D.from=ET.state.cur;
if(!D.ov.to)D.to=D.from==="USD"?"EUR":"USD"}
function rule(){
let txt;const a=RULE[ET.state.country];
if(!a)txt=T(11);
else txt=T(10).replace("{a}",a.map(x=>ET.fmt(x[1],x[0],{minimumFractionDigits:0,maximumFractionDigits:0})).join(" / ")).replace("{c}",dn(ET.state.country,"region"));
$("rx").textContent=txt}
function draw(){
const out=$("out"),rt=$("rt"),up=$("up");
rule();
if(!R){out.textContent="";rt.textContent="";return}
let when="";try{when=new Intl.DateTimeFormat(ET.state.lang,{dateStyle:"medium",timeStyle:"short"}).format(new Date(R.time))}catch(e){}
up.textContent=when?T(5)+": "+when:"";
const a=num(D.am),fr=R.rates[D.from],tr=R.rates[D.to];
if(!fr||!tr){out.textContent="—";rt.textContent="";return}
const k=tr/fr,v=a*k;
const line=ET.fmt(a,D.from,ad(a))+" = "+ET.fmt(v,D.to,ad(v));
out.textContent=line;
rt.textContent=T(13)+": "+ET.fmt(1,D.from)+" = "+ET.fmt(k,D.to,ad(k));
if(a>0)ET.log(line)}
async function load(){
$("rl").hidden=true;$("up").textContent=T(6);
const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
const lc=async u=>{const j=await get(u),o={};for(const c in j.usd)o[c.toUpperCase()]=j.usd[c];return{rates:o,time:Date.parse(j.date)||Date.now()}};
const src=[
async()=>{const j=await get("https://open.er-api.com/v6/latest/USD");if(j.result!=="success")throw 0;return{rates:j.rates,time:j.time_last_update_unix*1000}},
()=>lc("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"),
()=>lc("https://latest.currency-api.pages.dev/v1/currencies/usd.json")];
R=null;
for(const s of src){try{const r=await s();if(r&&r.rates&&r.rates.USD){R=r;break}}catch(e){}}
if(!R){$("up").textContent=T(7);$("rl").hidden=false;$("out").textContent="";$("rt").textContent="";return}
draw()}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("l_am").textContent=T(1);$("l_fr").textContent=T(2);$("l_to").textContent=T(3);
$("sw").textContent="⇄ "+T(4);$("rl").textContent=T(8);$("rh").textContent=T(9);
preset();fillSel();
if(!R&&$("rl").hidden)$("up").textContent=T(6);else if(!R)$("up").textContent=T(7);
draw()}
$("am").value=D.am;
$("am").addEventListener("input",e=>{D.am=e.target.value;draw()});
$("fr").onchange=e=>{D.from=e.target.value;D.ov.from=1;draw()};
$("to").onchange=e=>{D.to=e.target.value;D.ov.to=1;draw()};
$("sw").onclick=()=>{const x=D.from;D.from=D.to;D.to=x;D.ov.from=1;D.ov.to=1;fillSel();draw()};
$("rl").onclick=load;
ET.start({id:"fx",file:"fx.html",S,S2,labels,guide:()=>ET.t2(0),warn:()=>T(12)});
load();
</script>
</body>
</html>
