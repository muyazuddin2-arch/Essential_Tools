mr:"पासपोर्ट साइज फोटो मेकर|फोटो अपलोड करा|फोटोचा आकार|झूम|कागद|नियम देश आणि अर्जानुसार वेगळे असतात. अधिकृत फोटो अटी पहा.|साध्या फिकट पार्श्वभूमीवर समोरून काढलेला फोटो द्या, समायोजित करा आणि डाउनलोड करा. फोटो तुमच्या डिव्हाइसबाहेर जात नाही.",
ne:"राहदानी साइज फोटो मेकर|फोटो अपलोड गर्नुहोस्|फोटोको आकार|जुम|कागज|नियम देश र आवेदन अनुसार फरक हुन्छन्। आधिकारिक फोटो आवश्यकता हेर्नुहोस्।|सादा हल्का पृष्ठभूमिमा अगाडिबाट खिचेको फोटो दिनुहोस्, मिलाउनुहोस् र डाउनलोड गर्नुहोस्। फोटो तपाईंको उपकरणबाट बाहिर जाँदैन।",

const $=id=>document.getElementById(id),T=k=>ET.t(k);
/* photo sizes in mm [width,height]. Country default below; guidance only, confirm with the issuing office. */
const SZ=[[35,45],[40,50],[45,55],[51,51],[50,70],[33,48],[50,60]];
const P={BD:2,US:3,CA:4,CN:5,TR:6};
const PAPER={A4:[210,297],"4x6":[101.6,152.4]},LETTER=["US","CA"],DPI=300;
let D={sz:0,pp:"A4",ov:{}},img=null;
const px=mm=>Math.round(mm/25.4*DPI);
const dn=c=>{try{return new Intl.DisplayNames([ET.state.lang],{type:"region"}).of(c)||c}catch(e){return c}};
function paint(c,w,h){
c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);
if(!img)return;
const s=Math.max(w/img.width,h/img.height)*$("zm").value,iw=img.width*s,ih=img.height*s;
const x=-(iw-w)*(+$("ox").value+100)/200,y=-(ih-h)*(+$("oy").value+100)/200;
g.drawImage(img,x,y,iw,ih)}
const size=()=>SZ[D.sz],name=()=>size()[0]+"×"+size()[1]+" mm";
function draw(){const z=size();paint($("pv"),px(z[0]),px(z[1]))}
function save(c,file){c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},"image/jpeg",.95)}
function sheet(){
const z=size(),p=PAPER[D.pp],m=5,gp=2;let best=null;
[[p[0],p[1]],[p[1],p[0]]].forEach(o=>{const cl=Math.floor((o[0]-2*m+gp)/(z[0]+gp)),rw=Math.floor((o[1]-2*m+gp)/(z[1]+gp));if(!best||cl*rw>best.n)best={W:o[0],H:o[1],cl,rw,n:cl*rw}});
const one=document.createElement("canvas");paint(one,px(z[0]),px(z[1]));
const c=document.createElement("canvas");c.width=px(best.W);c.height=px(best.H);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
const ox=(best.W-(best.cl*(z[0]+gp)-gp))/2,oy=(best.H-(best.rw*(z[1]+gp)-gp))/2;
g.strokeStyle="#bbb";g.lineWidth=1;
for(let r=0;r<best.rw;r++)for(let k=0;k<best.cl;k++){const x=px(ox+k*(z[0]+gp)),y=px(oy+r*(z[1]+gp));g.drawImage(one,x,y);g.strokeRect(x+.5,y+.5,one.width-1,one.height-1)}
return c}
function info(){const c=ET.state.country;$("cn").textContent=(c==="INT"?"":dn(c)+": ")+name()}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("l_f").textContent=T(1);$("l_sz").textContent=T(2);$("l_pp").textContent=T(4);$("zm").setAttribute("aria-label",T(3));
if(!D.ov.sz)D.sz=P[ET.state.country]||0;
if(!D.ov.pp)D.pp=LETTER.includes(ET.state.country)?"4x6":"A4";
$("sz").innerHTML=SZ.map((z,i)=>'<option value="'+i+'">'+z[0]+"×"+z[1]+" mm</option>").join("");$("sz").value=D.sz;$("pp").value=D.pp;
$("d1").textContent="⬇ JPG";$("d2").textContent="⬇ "+(D.pp==="A4"?"A4":"4×6 in");
info();draw()}
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;$("d1").disabled=$("d2").disabled=false;draw()};i.src=URL.createObjectURL(f)};
["zm","ox","oy"].forEach(k=>$(k).oninput=draw);
$("sz").onchange=e=>{D.sz=+e.target.value;D.ov.sz=1;info();draw()};
$("pp").onchange=e=>{D.pp=e.target.value;D.ov.pp=1;$("d2").textContent="⬇ "+(D.pp==="A4"?"A4":"4×6 in")};
$("d1").onclick=()=>{const c=document.createElement("canvas");paint(c,px(size()[0]),px(size()[1]));save(c,"passport-photo.jpg");ET.logNow(name()+" · JPG")};
$("d2").onclick=()=>{save(sheet(),"passport-photo-sheet.jpg");ET.logNow(name()+" · "+(D.pp==="A4"?"A4":"4×6 in"))};
ET.start({id:"photo",file:"photo.html",S,labels,guide:()=>T(6),warn:()=>T(5),currency:false});
</script>
</body>
