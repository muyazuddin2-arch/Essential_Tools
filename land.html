/* square metres per unit. Local units are guidance only: katha/bigha/kanal etc. differ by district. */
const U={sqm:1,sqft:.09290304,ac:4046.8564224,ha:1e4,dec:40.468564224,katha:66.8901888,bigha:1335.4626,marla:25.29285264,kanal:505.8570528,guntha:101.171282,ropani:508.737,aana:31.796,perch:25.29285264,mu:666.6667,tsubo:3.305785,sotka:100,morgen:8567};
const N={sqm:"m²",sqft:"ft²",ac:"ac",ha:"ha",dec:"শতাংশ / cent",katha:"কাঠা / katha",bigha:"বিঘা / bigha (33 dec.)",marla:"مرلہ / marla",kanal:"کنال / kanal",guntha:"गुंठा / guntha",ropani:"रोपनी / ropani",aana:"आना / aana",perch:"perch",mu:"亩 / mu",tsubo:"坪 / tsubo",sotka:"сотка",morgen:"morgen"};
/* units shown per country; add a country by adding one line */
const L={INT:["sqm","ha","sqft","ac"],BD:["dec","katha","bigha","sqft","sqm","ac","ha"],IN:["guntha","dec","kanal","marla","sqft","sqm","ac","ha"],PK:["marla","kanal","sqft","sqm","ac","ha"],NP:["ropani","aana","sqft","sqm","ac","ha"],LK:["perch","ac","ha","sqm","sqft"],CN:["mu","sqm","ha"],JP:["tsubo","sqm","ha"],RU:["sotka","sqm","ha"],ZA:["morgen","ha","sqm","ac"],US:["sqft","ac","sqm","ha"]};
["CA","GB","IE","AU"].forEach(c=>L[c]=L.US);["UA","KZ"].forEach(c=>L[c]=L.RU);
/* local names of land records (proper nouns, shown as written locally) */
const R={INT:"Title deed · Cadastre · Land registry",BD:"খতিয়ান · দাগ · মৌজা · নামজারি · ই-পর্চা",IN:"Khata · Jamabandi · RoR · 7/12 · Bhulekh",PK:"Fard · Jamabandi · Khasra",NP:"लालपुर्जा · नापी नक्सा",LK:"Deed · Survey plan",US:"Deed · Title · Plat · County recorder",CA:"Land title · Survey plan",GB:"Title register · Title plan (HM Land Registry)",IE:"Folio · Map",AU:"Certificate of Title",DE:"Grundbuch · Flurkarte",AT:"Grundbuch",CH:"Grundbuch",FR:"Cadastre · Livre foncier",ES:"Catastro · Registro de la Propiedad",IT:"Visura catastale",NL:"Kadaster",CN:"不动产权证书",JP:"登記事項証明書",KR:"등기부등본",RU:"Выписка из ЕГРН",TR:"Tapu",SA:"صك الملكية",ZA:"Title deed"};
let D={a:"1",u:"",n:"1",d:"1"};
/* accepts Arabic-Indic, Persian, Devanagari and Bengali digits; comma or dot as decimal mark */
function num(v){let s=String(v||"").trim().replace(/\s/g,"");
s=s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x6F0).replace(/[\u0966-\u096F]/g,c=>c.charCodeAt(0)-0x966).replace(/[\u09E6-\u09EF]/g,c=>c.charCodeAt(0)-0x9E6);
if(s.includes(",")&&s.includes("."))s=s.replace(/,/g,"");else s=s.replace(",",".");
const n=parseFloat(s);return isFinite(n)&&n>=0?n:0}
const list=()=>L[ET.state.country]||L.INT;
const nf=x=>{try{return new Intl.NumberFormat(ET.state.lang,{maximumFractionDigits:4}).format(x)}catch(e){return String(x)}};
function draw(){
const l=list(),out=$("out");out.replaceChildren();
const a=num(D.a),n=num(D.n),d=num(D.d);
if(!a||!d){return}
const m2=a*U[D.u]*n/d,rows=l.map(k=>nf(m2/U[k])+" "+N[k]);
rows.forEach(x=>{const li=document.createElement("li");li.textContent=x;li.setAttribute("dir","auto");out.appendChild(li)});
$("lr").textContent=R[ET.state.country]||R.INT;
ET.log(nf(a)+" "+N[D.u]+" × "+nf(n)+"/"+nf(d)+" = "+rows.slice(0,3).join(" · "))}
function labels(){
$("t").textContent=T(0);document.title=T(0)+" | Essential Tools";
$("l_am").textContent=T(1);$("l_un").textContent=T(2);$("l_sh").textContent=T(3);$("h_rs").textContent=T(4);$("lt").textContent=T(5);
const l=list();if(!l.includes(D.u))D.u=l[0];
$("un").innerHTML=l.map(k=>'<option value="'+k+'">'+N[k]+'</option>').join("");$("un").value=D.u;
$("lr").textContent=R[ET.state.country]||R.INT;draw()}
$("am").value=D.a;$("sn").value=D.n;$("sd").value=D.d;
$("am").oninput=e=>{D.a=e.target.value;draw()};
$("sn").oninput=e=>{D.n=e.target.value;draw()};
$("sd").oninput=e=>{D.d=e.target.value;draw()};
$("un").onchange=e=>{D.u=e.target.value;draw()};
ET.start({id:"land",file:"land.html",S,labels,guide:()=>T(7),warn:()=>T(6),currency:false});
</script>
